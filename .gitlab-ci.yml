image: elixir:1.18

stages:
  - test
  - sync

variables:
  MIX_ENV: test

default:
  tags:
    - self-hosted

cache:
  key:
    files:
      - mix.lock
  paths:
    - _build/
    - deps/

before_script:
  - mix local.hex --force
  - mix local.rebar --force
  - mix deps.get

test:
  stage: test
  script:
    - mix test

sync-github:
  stage: sync
  image: alpine:3
  cache: []
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script: []
  script:
    - |
      apk add --no-cache git openssh
      cat > /tmp/git-askpass <<'EOF'
      #!/bin/sh
      case "$1" in
        Username*) echo "x-access-token" ;;
        Password*) echo "$GITHUB_TOKEN" ;;
      esac
      EOF
      chmod +x /tmp/git-askpass
      GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 \
        git push https://github.com/eiseron/credo-checks.git HEAD:main --force --tags
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
