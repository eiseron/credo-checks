image: elixir:1.18

stages:
  - test

variables:
  MIX_ENV: test

default:
  tags:
    - self-hosted

cache:
  key:
    files:
      - mix.lock
  paths:
    - _build/
    - deps/

before_script:
  - mix local.hex --force
  - mix local.rebar --force
  - mix deps.get

test:
  stage: test
  script:
    - mix test
